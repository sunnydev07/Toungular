name: Package and Release Toungular

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  backend-package:
    name: Build & Publish Backend Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://npm.pkg.github.com'
          scope: '@sunnydev07'

      - name: Install dependencies
        working-directory: backend
        run: npm ci || npm install

      - name: Validate both Prisma schemas
        working-directory: backend
        run: npm run schema:check

      - name: Generate PostgreSQL client
        working-directory: backend
        run: npm run prisma:generate:postgres

      - name: Typecheck service contracts against PostgreSQL client
        working-directory: backend
        run: npx tsc --noEmit -p tsconfig.json

      - name: Generate Prisma client
        working-directory: backend
        run: npm run prisma:generate

      - name: Run test suite
        working-directory: backend
        run: npm test

      - name: Build TypeScript backend
        working-directory: backend
        run: npm run build

      - name: Publish to GitHub Packages
        working-directory: backend
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm publish || echo "Package version already published or skipped."

  android-app-package:
    name: Build & Package Android App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Verify static analysis
        working-directory: mobile
        run: flutter analyze

      - name: Build Android Debug APK
        working-directory: mobile
        run: flutter build apk --debug --dart-define=API_BASE_URL=https://api.toungular.com

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: toungular-app-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload APK to GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/build/app/outputs/flutter-apk/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
